<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Branding & Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2BB673" />
    
    <!-- SEO Metadata -->
    <title>VetX | Comprehensive Pet Care & Veterinary Directory</title>
    <meta name="description" content="Manage your pet's health, book appointments with top-rated veterinarians, and access medical records all in one place." />
    <meta name="keywords" content="veterinary, pet care, dog health, cat health, vet directory, pet records" />

    <!-- Open Graph (For Social Media/WhatsApp Sharing) -->
    <meta property="og:title" content="VetX | Comprehensive Pet Care" />
    <meta property="og:description" content="Digital health records and appointment booking for your pets." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.jpg" /> <!-- Path to a thumbnail image -->

    <!-- Fonts: Inter is the gold standard for clean SaaS/Medical Dashboards -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      /* Prevent white flash before React loads and set default typography */
      :root {
        --brand-green: #2BB673;
        --bg-gray: #F9FAFB;
      }
      
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-gray);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Simple loading state hidden once React mounts */
      #root:empty {
        background-color: var(--bg-gray);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #root:empty::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 3px solid #E5E7EB;
        border-top-color: var(--brand-green);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
